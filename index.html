<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<meta name="description" content="NVA Token - BNB Chain üzerinde oluşturulan proje portalı.">
<title>NVA Token | Resmi Portal</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #080b14;
  color: #ffffff;
  line-height: 1.6;
}

.container {
  width: 92%;
  max-width: 1050px;
  margin: auto;
}

/* HEADER */
header {
  padding: 20px 0;
  border-bottom: 1px solid #20263a;
  background: rgba(8,11,20,0.95);
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 27px;
  font-weight: 800;
  color: #38bdf8;
}

.nav a {
  color: #cbd5e1;
  text-decoration: none;
  margin-left: 15px;
  font-size: 14px;
}

.nav a:hover {
  color: #38bdf8;
}

/* HERO */
.hero {
  text-align: center;
  padding: 75px 15px 55px;
}

.badge {
  display: inline-block;
  background: #172033;
  border: 1px solid #263650;
  color: #38bdf8;
  padding: 7px 14px;
  border-radius: 30px;
  font-size: 13px;
  margin-bottom: 20px;
}

.hero h1 {
  font-size: 52px;
  margin-bottom: 15px;
}

.hero h1 span {
  color: #38bdf8;
}

.hero p {
  color: #94a3b8;
  max-width: 650px;
  margin: auto;
  font-size: 17px;
}

.buttons {
  margin-top: 30px;
}

.btn {
  display: inline-block;
  padding: 13px 22px;
  border-radius: 9px;
  text-decoration: none;
  margin: 5px;
  font-weight: bold;
}

.primary {
  background: #38bdf8;
  color: #06111c;
}

.secondary {
  background: #172033;
  color: #ffffff;
  border: 1px solid #2b3954;
}

/* CARDS */
.section {
  padding: 35px 0;
}

.section-title {
  text-align: center;
  margin-bottom: 25px;
  font-size: 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.card {
  background: #101625;
  border: 1px solid #202b40;
  border-radius: 15px;
  padding: 25px;
}

.card h3 {
  color: #38bdf8;
  margin-bottom: 8px;
}

.card p {
  color: #94a3b8;
  font-size: 14px;
}

/* TOKEN INFO */
.token-box {
  background: linear-gradient(135deg, #111a2c, #0d1322);
  border: 1px solid #263650;
  border-radius: 18px;
  padding: 28px;
}

.info {
  display: flex;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #202a3e;
  gap: 15px;
}

.info:last-child {
  border-bottom: none;
}

.label {
  color: #94a3b8;
}

.value {
  color: #ffffff;
  text-align: right;
  word-break: break-all;
}

/* ROADMAP */
.roadmap {
  border-left: 2px solid #38bdf8;
  padding-left: 22px;
}

.phase {
  background: #101625;
  border: 1px solid #202b40;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 15px;
}

.phase h3 {
  color: #38bdf8;
}

/* FOOTER */
footer {
  margin-top: 50px;
  padding: 30px 0;
  text-align: center;
  border-top: 1px solid #20263a;
  color: #64748b;
  font-size: 13px;
}

/* MOBILE */
@media (max-width: 700px) {
  .hero h1 {
    font-size: 38px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .nav a {
    display: none;
  }

  .info {
    flex-direction: column;
  }

  .value {
    text-align: left;
  }
}
</style>
</head>

<body>

<header>
  <div class="container nav">
    <div class="logo">NVA</div>

    <nav>
      <a href="#about">Hakkında</a>
      <a href="#token">Token</a>
      <a href="#roadmap">Yol Haritası</a>
    </nav>
  </div>
</header>

<main>

<section class="hero">
  <div class="badge">BNB Chain • NVA Token</div>

  <h1>Yeni Nesil <span>NVA</span></h1>

  <p>
    NVA ekosisteminin resmi bilgi ve proje portalı.
    Token bilgileri, proje gelişmeleri ve gelecek planları
